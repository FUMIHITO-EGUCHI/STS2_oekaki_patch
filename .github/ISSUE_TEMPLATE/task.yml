name: Task
description: AI 向けタスク packet（feature / refactor / 小粒実装）
title: "[task] "
labels: ["status: todo"]
body:
  - type: markdown
    attributes:
      value: |
        AI（Claude / Codex）が着手できる粒度のタスクを記述してください。
        完了判定は人間が行います。AI は結果と検証内容をコメントして完了申請します。

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: このタスクで達成したいこと（1〜3 行）
      placeholder: 例) 消しゴム倍率の上限を設定から変更できるようにする
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / Files in scope
      description: 触る想定のファイル・モジュール
      placeholder: |
        - src/EraserMod/Config.cs
        - src/EraserMod/HotkeyHandler.cs
        - README.md
    validations:
      required: false

  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: 作業項目。AI が進捗に合わせてチェックを更新する
      value: |
        - [ ]
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 完了と認めるための条件
      placeholder: |
        - `dotnet build src/EraserMod -c Release` が通る
        - `dotnet build src/Injector -c Release` が通る
        - README の説明が実装と一致している
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / Links
      description: 関連 Issue、調査メモ、参照リンク
    validations:
      required: false

